<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnipay</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 16px; color: #333; }
        .card { background: #fff; padding: 20px; border-radius: 12px; max-width: 320px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .app-view { display: none; }
    </style>
</head>
<body>

    <!-- Login Box -->
    <div id="loginBox" class="card">
        <h2>Omnipay Login</h2>
        <input type="tel" placeholder="Mobile Number" id="mob">
        <input type="password" placeholder="PIN / Password" id="pwd">
        <button onclick="document.getElementById('loginBox').style.display='none'; document.getElementById('mainApp').style.display='block';">Login / Fingerprint</button>
    </div>

    <!-- Main App View -->
    <div id="mainApp" class="app-view">
        <h2 style="color: #2563eb;">Omnipay SuperApp</h2>
        <div style="background: #2563eb; color: white; padding: 15px; border-radius: 10px; margin: 15px 0;">
            Wallet Balance: <b>₹12,450.00</b>
        </div>
        
        <h3>Services</h3>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px;">
            <div style="background: white; padding: 12px; border-radius: 8px; text-align: center;">📱 Recharge</div>
            <div style="background: white; padding: 12px; border-radius: 8px; text-align: center;">💡 EB Bill</div>
            <div style="background: white; padding: 12px; border-radius: 8px; text-align: center;">🚌 Bus / Train</div>
            <div style="background: white; padding: 12px; border-radius: 8px; text-align: center;">🪙 Gold Live</div>
        </div>

        <button style="background: #dc2626; margin-top: 20px;" onclick="document.getElementById('mainApp').style.display='none'; document.getElementById('loginBox').style.display='block';">Logout</button>
    </div>

    <script>
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
